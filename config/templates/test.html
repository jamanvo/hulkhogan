<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload & API Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #fafafa;
        }

        /* ── 레이아웃 ── */
        .left-panel {
            width: 33.333%;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel {
            width: 66.666%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            overflow: hidden;
        }

        /* ── 이미지 섹션 ── */
        .image-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
            min-height: 0;
        }

        .image-section + .image-section {
            border-top: 1px solid #ddd;
        }

        .image-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        /* ── 캐러셀 래퍼 ── */
        .carousel-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            gap: 6px;
        }

        /* 이미지 뷰포트 + 좌우 화살표 */
        .carousel-viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
        }

        .carousel-viewport img.thumb {
            max-width: calc(100% - 48px); /* 화살표 공간 확보 */
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            transition: border-color 0.15s;
        }

        .carousel-viewport img.thumb:hover {
            border-color: #999;
        }

        .no-image {
            font-size: 13px;
            color: #aaa;
        }

        /* 화살표 버튼 */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #ccc;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #444;
            z-index: 2;
            transition: background 0.15s, border-color 0.15s;
            user-select: none;
        }

        .arrow-btn:hover {
            background: #fff;
            border-color: #888;
        }

        .arrow-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .arrow-btn.left {
            left: 2px;
        }

        .arrow-btn.right {
            right: 2px;
        }

        /* 인디케이터 + 치수 */
        .carousel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 18px;
            flex-shrink: 0;
        }

        .page-indicator {
            font-size: 11px;
            color: #888;
        }

        .dim-label {
            font-size: 11px;
            color: #888;
        }

        /* ── 파일 입력 ── */
        #imageInput {
            font-size: 12px;
            margin-bottom: 8px;
        }

        /* ── 오른쪽 패널 ── */
        .right-panel h3 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .api-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #apiBtn {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
        }

        #apiBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status-text {
            font-size: 12px;
            color: #888;
        }

        .result-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .result-box label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        pre#resultOutput {
            flex: 1;
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
            min-height: 0;
        }

        /* ── 모달 ── */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #modal-close {
            position: fixed;
            top: 18px;
            right: 26px;
            color: #fff;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            z-index: 1002;
        }

        /* 모달 이미지 뷰포트 – 테두리 추가 */
        #modal-viewport {
            width: 80vw;
            height: 72vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        #modal-img {
            position: absolute;
            max-width: none;
            max-height: none;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: center center;
        }

        #modal-img.grabbing {
            cursor: grabbing;
        }

        #modal-controls {
            margin-top: 14px;
            background: #fff;
            border-radius: 8px;
            padding: 8px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1002;
        }

        #modal-controls button {
            padding: 6px 14px;
            cursor: pointer;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
        }

        #modal-controls button:hover {
            background: #0056b3;
        }

        #modal-scale-label {
            font-size: 12px;
            color: #555;
            min-width: 42px;
            text-align: center;
        }

        select {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
    </style>
</head>
<body>

<!-- ── 왼쪽 1/3: 이미지 상하 ── -->
<div class="left-panel">

    <!-- 상단: 원본 이미지 캐러셀 -->
    <div class="image-section">
        <h3>이미지 업로드</h3>
        <input type="file" id="imageInput" accept="image/*" multiple>
        <div class="carousel-wrapper">
            <div class="carousel-viewport" id="orig-viewport">
                <button class="arrow-btn left" id="orig-prev" disabled>&#8249;</button>
                <p class="no-image" id="no-image-text">이미지를 선택해주세요.</p>
                <img class="thumb" id="orig-thumb" style="display:none;" title="클릭하여 확대" alt="원본 이미지">
                <button class="arrow-btn right" id="orig-next" disabled>&#8250;</button>
            </div>
            <div class="carousel-footer">
                <span class="page-indicator" id="orig-indicator"></span>
                <span class="dim-label" id="original-dims"></span>
            </div>
        </div>
    </div>

    <!-- 하단: 가공된 이미지 캐러셀 -->
    <div class="image-section">
        <h3>가공한 이미지</h3>
        <div class="carousel-wrapper">
            <div class="carousel-viewport" id="enh-viewport">
                <button class="arrow-btn left" id="enh-prev" disabled>&#8249;</button>
                <p class="no-image" id="no-enhanced-text">API 호출 후 표시됩니다.</p>
                <img class="thumb" id="enh-thumb" style="display:none;" title="클릭하여 확대" alt="가공된 이미지">
                <button class="arrow-btn right" id="enh-next" disabled>&#8250;</button>
            </div>
            <div class="carousel-footer">
                <span class="page-indicator" id="enh-indicator"></span>
                <span class="dim-label" id="enhanced-dims"></span>
            </div>
        </div>
    </div>

</div>

<!-- ── 오른쪽 2/3: API 결과 ── -->
<div class="right-panel">
    <h3>API 컨트롤러</h3>
    <select id="model-selector">
        <option value="nemotron">nemotron-ocr-v2</option>
        <option value="gemma4:31b">gemma4:31b</option>
        <option value="qwen3.6:35b-a3b">qwen3.6:35b-a3b</option>
        <option value="qwen3.5:35b">qwen3.5:35b</option>
    </select>
    {#    <select id="type-selector">#}
    {#        <option value="">단일호출</option>#}
    {#        <option value="-vote">투표(3회 호출 후 투표)</option>#}
    {#    </select>#}
    <div class="api-row">
        <button id="apiBtn" disabled>API 호출 (/api/agent/image-to-text)</button>
        <span id="status-text"></span>
    </div>
    <div class="result-box">
        <label>결과 (JSON)</label>
        <pre id="resultOutput">결과가 여기에 표시됩니다.</pre>
    </div>
</div>

<!-- ── 모달 ── -->
<div id="modal">
    <span id="modal-close">&times;</span>
    <div id="modal-viewport">
        <img id="modal-img" src="" draggable="false" alt="확대 이미지">
    </div>
    <div id="modal-controls">
        <button onclick="changeScale(0.25)">+ 확대</button>
        <button onclick="changeScale(-0.25)">− 축소</button>
        <button onclick="resetView()">초기화</button>
        <span id="modal-scale-label">100%</span>
    </div>
</div>

<script>
    /* ── 요소 참조 ── */
    const imageInput = document.getElementById('imageInput');
    const apiBtn = document.getElementById('apiBtn');
    const statusText = document.getElementById('status-text');
    const resultOutput = document.getElementById('resultOutput');
    const modelSelector = document.getElementById('model-selector');
    {#const typeSelector = document.getElementById('type-selector');#}

    const modal = document.getElementById('modal');
    const modalViewport = document.getElementById('modal-viewport');
    const modalImg = document.getElementById('modal-img');
    const modalClose = document.getElementById('modal-close');
    const modalScaleLabel = document.getElementById('modal-scale-label');

    /* ── 캐러셀 상태 ── */
    const carousels = {
        orig: {
            srcs: [],
            idx: 0,
            thumb: document.getElementById('orig-thumb'),
            noText: document.getElementById('no-image-text'),
            prevBtn: document.getElementById('orig-prev'),
            nextBtn: document.getElementById('orig-next'),
            indicator: document.getElementById('orig-indicator'),
            dims: document.getElementById('original-dims'),
        },
        enh: {
            srcs: [],
            idx: 0,
            thumb: document.getElementById('enh-thumb'),
            noText: document.getElementById('no-enhanced-text'),
            prevBtn: document.getElementById('enh-prev'),
            nextBtn: document.getElementById('enh-next'),
            indicator: document.getElementById('enh-indicator'),
            dims: document.getElementById('enhanced-dims'),
        },
    };

    /* 캐러셀 공통 렌더 */
    function renderCarousel(c) {
        if (c.srcs.length === 0) {
            c.thumb.style.display = 'none';
            c.noText.style.display = 'block';
            c.prevBtn.disabled = true;
            c.nextBtn.disabled = true;
            c.indicator.textContent = '';
            c.dims.textContent = '';
            return;
        }
        const src = c.srcs[c.idx];
        c.thumb.src = src;
        c.thumb.style.display = 'block';
        c.noText.style.display = 'none';
        c.prevBtn.disabled = c.idx === 0;
        c.nextBtn.disabled = c.idx === c.srcs.length - 1;
        c.indicator.textContent = c.srcs.length > 1 ? `${c.idx + 1} / ${c.srcs.length}` : '';
    }

    /* 치수 업데이트 */
    function bindDims(c) {
        c.thumb.addEventListener('load', () => {
            if (c.thumb.naturalWidth) {
                c.dims.textContent = `${c.thumb.naturalWidth} × ${c.thumb.naturalHeight} px`;
            }
        });
    }

    bindDims(carousels.orig);
    bindDims(carousels.enh);

    /* 화살표 이벤트 */
    carousels.orig.prevBtn.addEventListener('click', () => {
        carousels.orig.idx--;
        renderCarousel(carousels.orig);
    });
    carousels.orig.nextBtn.addEventListener('click', () => {
        carousels.orig.idx++;
        renderCarousel(carousels.orig);
    });
    carousels.enh.prevBtn.addEventListener('click', () => {
        carousels.enh.idx--;
        renderCarousel(carousels.enh);
    });
    carousels.enh.nextBtn.addEventListener('click', () => {
        carousels.enh.idx++;
        renderCarousel(carousels.enh);
    });

    /* 썸네일 클릭 → 모달 */
    carousels.orig.thumb.addEventListener('click', () => openModal(carousels.orig.thumb.src));
    carousels.enh.thumb.addEventListener('click', () => {
        const src = carousels.enh.thumb.src;
        if (src && src !== window.location.href) openModal(src);
    });

    /* ── 이미지 업로드 (다중) ── */
    let selectedFiles = [];

    imageInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        selectedFiles = files;

        const c = carousels.orig;
        c.srcs = [];
        c.idx = 0;

        let loaded = 0;
        files.forEach((file, i) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                c.srcs[i] = ev.target.result;
                loaded++;
                if (loaded === files.length) {
                    renderCarousel(c);
                    apiBtn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        });
    });

    /* ── 모달 상태 ── */
    let scale = 1, tx = 0, ty = 0;
    let dragging = false, dragStartX = 0, dragStartY = 0;

    function applyTransform() {
        modalImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        modalScaleLabel.textContent = Math.round(scale * 100) + '%';
    }

    function changeScale(delta) {
        scale = Math.max(0.1, Math.min(10, scale + delta));
        applyTransform();
    }

    function resetView() {
        /* 모달 뷰포트 세로(px) 기준으로 초기 스케일 계산 */
        const vpH = modalViewport.clientHeight;
        const imgNatH = modalImg.naturalHeight;
        scale = imgNatH > 0 ? vpH / imgNatH : 1;
        tx = 0;
        ty = 0;
        applyTransform();
    }

    function openModal(src) {
        modalImg.src = src;
        modal.style.display = 'flex';

        requestAnimationFrame(() => {
            if (modalImg.complete && modalImg.naturalHeight) {
                resetView();
            } else {
                modalImg.onload = () => {
                    resetView();
                };
            }
        });
    }

    function closeModal() {
        modal.style.display = 'none';
        dragging = false;
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    /* 드래그 패닝 */
    modalImg.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = true;
        dragStartX = e.clientX - tx;
        dragStartY = e.clientY - ty;
        modalImg.classList.add('grabbing');
    });
    document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        e.preventDefault();
        tx = e.clientX - dragStartX;
        ty = e.clientY - dragStartY;
        applyTransform();
    });
    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        modalImg.classList.remove('grabbing');
    });

    /* 휠 확대/축소 */
    modalViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        changeScale(e.deltaY > 0 ? -0.1 : 0.1);
    }, {passive: false});

    /* ── API 호출 ── */
    apiBtn.addEventListener('click', async () => {
        if (!selectedFiles.length) return;

        /* 가공 이미지 초기화 */
        const ec = carousels.enh;
        ec.srcs = [];
        ec.idx = 0;
        renderCarousel(ec);

        const formData = new FormData();
        selectedFiles.forEach(file => formData.append('image_file', file));
        formData.append('model', modelSelector.value);

        resultOutput.textContent = '호출 중...';
        statusText.textContent = '요청 전송 중…';
        apiBtn.disabled = true;

        let provider = '';
        if (modelSelector.value === 'nemotron') provider = 'nemotron-ocr-v2';
        else provider = `vaiv`;
        {#else provider = `vaiv${typeSelector.value}`;#}

        try {
            const response = await fetch(`/api/agent/image-to-text/${provider}`, {
                method: 'POST',
                body: formData,
            });

            const data = await response.json();

            /* 가공 이미지 처리 – 배열 또는 단일 */
            const enhancedRaw = data.enhanced_images;
            if (enhancedRaw) {
                const enhArr = Array.isArray(enhancedRaw) ? enhancedRaw : [enhancedRaw];
                ec.srcs = enhArr.map(b64 => `data:image/png;base64,${b64}`);
                ec.idx = 0;
                renderCarousel(ec);
            }

            /* 결과 테이블 렌더 */
            try {
                /* detail이 배열이면 여러 결과, 단일 객체이면 감싸서 처리 */
                let html = `<table border="1" style="border-collapse:collapse; width:100%; margin-bottom:12px;">
                        <thead>
                            <tr>
                                <th>no.</th>
                                <th>품목명</th>
                                <th>수량</th>
                                <th>결제금액</th>
                                <th>단가</th>
                                <th>단위</th>
                            </tr>
                        </thead>
                        <tbody>`;
                data.detail.items.forEach((item, di) => {
                    html += `<tr>
                                <td>${di + 1}</td>
                                <td style="white-space:pre-wrap;">${item.name}</td>
                                <td>${item.count}</td>
                                <td>${item.price}</td>
                                <td>${item.unit_price}</td>
                                <td>${item.unit}</td>
                              </tr>`;
                });
                html += `</tbody></table>`;

                resultOutput.innerHTML = html;
            } catch (error) {
                console.log(error);
                resultOutput.textContent = typeof data.detail === 'string'
                    ? data.detail
                    : JSON.stringify(data.detail, null, 2);
            }

            statusText.textContent = '완료';

        } catch (error) {
            resultOutput.textContent = '에러 발생: ' + error.message;
            statusText.textContent = '실패';
        } finally {
            apiBtn.disabled = false;
        }
    });
</script>
</body>
</html>
