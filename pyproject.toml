[project]
name = "hulkhogan"
version = "0.1.0"
description = ""
authors = [
    { name = "jarvis", email = "ihnkyo.chung@okpos.co.kr" }
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "django-ninja (>=1.4.5,<2.0.0)",
    "django-ninja-extra (>=0.30.2,<0.31.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
]


[build-system]
